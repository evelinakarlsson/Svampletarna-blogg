    <link rel="stylesheet" href="./css/global.css" />

    <header>
        <nav>

    <main>
        <div>
            <p>

            <button type="button" id="clear-history-btn">Rensa alla fynd</button>

        <section class="svamp-lista">
            <h2>Svamplista</h2>
            <ul>
                <template>
                    <li>
                        <article>
                            <!-- placeholder svamp-->
                            <img src="./img/exempelsvamp.jpg" alt="Exempelsvamp">
                            <h3>Exempelnamn svenska</h3>
                            <p>Exempelnamn latin</p>
                            <details>
                                <summary>Ätlig</summary>
                                <p>Ätbarhet</p>
                            </details>
                            <p>Beskrivning</p>
                            <p class="location">Fyndplats</p>
                            <button type="button" class="remove-mushroom-btn">Ta bort</button>
                        </article>
                    </li>
                </template>
            </ul>
        </section>

    <footer>
        <p>© Svampletarna 2026</p>
