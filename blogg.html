<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogg - Svampletarna</title>
    <!-- Läser in sidornas gemensamma CSS först och sedan bloggens egen CSS -->
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/blogg.css">
    <!-- Läser in bloggens JavaScript. defer gör att koden körs när HTML:en har lästs in -->
    <script src="./js/blogg.js" defer></script>
</head>

<body>
    <header>
        <!-- Huvudmeny: loggan först, sedan sidans länkar -->
        <nav>
            <ul>
                <li>
                    <a href="./index.html">
                        <img class="logo" src="./img/svampletarna-logo.png" alt="Svampletarna logotype">
                    </a>
                </li>
                <li><a href="./index.html">Alla svampar</a></li>
                <li><a href="./mina-fynd.html">Mina fynd</a></li>
                <li><a href="./om-svampar.html">Om svampar</a></li>
                <li><a href="./blogg.html" aria-current="page">Blogg</a></li>
                <li><a href="./login.html">Logga in</a></li>
            </ul>
        </nav>
    
        <div class="hero">
            <h1>Blogg</h1>
            <p>Dela dina fynd och upplevelser från svampskogen.</p>
        </div>
    </header>

    <main>
        <!-- Visas när användaren inte är inloggad. Döljs av scriptet när någon är inloggad  -->
        <p id="inloggningsmeddelande">
            <a href="./login.html">Logga in</a> för att skriva inlägg och kommentarer.
        </p>

        <!-- Formuläret för nya inlägg. hidden döljer sektionen tills scriptet visar den för inloggade användare -->
        <section id="skriv-inlagg" hidden>
            <h2>Skriv ett inlägg</h2>

            <form id="bloggformular">
                <label for="titel">Titel</label>
                <input type="text" id="titel" name="titel" required>

                <label for="text">Text</label>
                <textarea id="text" name="text" rows="6" required></textarea>

                <button type="submit">Publicera inlägg</button>
            </form>
        </section>

        <section>
            <h2>Blogginlägg</h2>

            <!-- JavaScript fyller den tomma div:en med blogginlägg och kommentarer. Varje inlägg skapas 
            som ett article-element. Inloggade användare får också ett kommentarsformulär -->
            <div id="blogginlagg"></div>
        </section>
    </main>

    <footer>
        <p>© Svampletarna 2026</p>
    </footer>
</body>
</html>
