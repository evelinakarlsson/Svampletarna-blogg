<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logga in - Svampletarna</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/login.css">
    <script src="./js/login.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>
                    <a href="./index.html">
                        <img class="logo" src="./img/svampletarna-logo.png" alt="Svampletarna logotype">
                    </a>
                </li>
                <li><a href="./index.html">Alla svampar</a></li>
                <li><a href="./mina-fynd.html">Mina fynd</a></li>
                <li><a href="./om-svampar.html">Om svampar</a></li>
                <li><a href="./blogg.html">Blogg</a></li>
                <li><a href="./login.html" aria-current="page">Logga in</a></li>
            </ul>
        </nav>

        <div class="hero">
            <h1>Logga in</h1>
            <p>Välkommen till svampletarnas hemsida</p>
            <p>Logga in för att dela dina svampturer och kommentera andras fynd.</p>
        </div>
             
    </header>
    <main>
        <div class="login-container">

            <div class="login-content">
                <form id="loginForm">
                    <h2>Logga in</h2>
                    <label for="namn">Namn:</label>
                    <input type="text" id="namn" name="namn">

                    <label for="losenord">Lösenord:</label>
                    <input type="password" id="losenord" name="losenord">

                    <button type="submit" id="loginBtn">Logga in</button>
                </form>

                <p id="message"></p>
                <button type="button" id="logoutBtn" hidden>Logga ut</button>
            </div>

        </div>
    </main>

    <footer>
        <p>© Svampletarna 2026</p>
    </footer>
    
</body>
</html>
